hyperparameters:
  client:
    batch_size: 250
    local_epochs: 5
    loss: CrossEntropyLoss
    persistency: true
    alpha: 0.5
    beta: 0.5
    clipping: 1.0
    optimizer:
      name: Adam
      lr: 0.001
      # momentum: 0.9
      weight_decay: 0.0001
    scheduler:
      gamma: 0.995
      step_size: 1
    proxy_optimizer:
      name: Adam
      lr: 0.001
      # momentum: 0.9
      weight_decay: 0.0001
    proxy_scheduler:
      gamma: 0.995
      step_size: 1
    proxy_model: MLP
  model: LeNet5

name: fluke.algorithms.decentralized.ProxyDFL